<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ما البرنامج؟ — عرض تفاعلي</title>
<!-- الخطوط (إن لم يتوفر الإنترنت سيستخدم المتصفح خطًا بديلًا تلقائيًا) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================
   🎨 الألوان والهوية البصرية
   ========================================================== */
:root{
  --p900:#2E1065; --p800:#4C1D95; --p700:#6D28D9; --p600:#7C3AED; --p500:#8B5CF6;
  --p400:#A78BFA; --p300:#C4B5FD; --p200:#DDD6FE; --p100:#EDE9FE; --p50:#F7F5FF;
  --mint:#14B8A6; --mint-l:#CCFBF1; --pink:#EC4899; --pink-l:#FCE7F3; --amber:#F59E0B; --amber-l:#FEF3C7;
  --ink:#221A3A; --muted:#6E6688;
  --ok:#16A34A; --ok-l:#DCFCE7; --bad:#E11D48; --bad-l:#FFE4E6;
  --code:#1C1830; --code2:#2A2445;
  /* ألوان أشكال المخطط الانسيابي (مطابقة للكتاب) */
  --sh-start:#DCD3EA; --sh-io:#CDE8B0; --sh-proc:#FAD0A8; --sh-dec:#BFD4F2;
  --shadow:0 18px 40px -20px rgba(76,29,149,.45);
  --font:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  --mono:'JetBrains Mono',Consolas,'Courier New','Tajawal',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:var(--font);background:#E6E0F8;color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;touch-action:manipulation}
body:not(.ui-on){cursor:none}
input,textarea{user-select:text;font-family:inherit}
button{font-family:inherit;color:inherit}
::-webkit-scrollbar{display:none}
*{scrollbar-width:none}

/* ==========================================================
   🖥️ المسرح: مساحة ثابتة 16:9 تتمدد لتملأ الشاشة
   ========================================================== */
#stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform-origin:center;overflow:hidden;
  background:radial-gradient(circle at 88% 8%,#F1E8FF 0,transparent 38%),radial-gradient(circle at 6% 94%,#DDF7F2 0,transparent 32%),#FBFAFF}
#stage::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(109,40,217,.13) 1.6px,transparent 1.6px);background-size:34px 34px;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),rgba(0,0,0,.15));mask-image:linear-gradient(to bottom,rgba(0,0,0,.7),rgba(0,0,0,.15))}
.bg-sym{position:absolute;font-family:var(--mono);color:var(--p300);opacity:.4;font-weight:700;direction:ltr;animation:floaty 10s ease-in-out infinite;z-index:0;pointer-events:none}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(4deg)}}

/* ==========================================================
   📄 الشرائح وتأثيرات الانتقال
   ========================================================== */
#slides{position:absolute;inset:0;z-index:1}
.slide{position:absolute;inset:0;padding:44px 80px 96px;display:flex;flex-direction:column;gap:24px;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .55s ease,transform .65s cubic-bezier(.2,.8,.2,1),visibility 0s linear .65s}
.slide.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;
  transition:opacity .55s ease,transform .65s cubic-bezier(.2,.8,.2,1),visibility 0s}
.anim-slide{transform:translateX(calc(var(--dir,1) * 90px))}
.anim-slide.out{transform:translateX(calc(var(--dir,1) * -90px))}
.anim-zoom{transform:scale(.92)}
.anim-zoom.out{transform:scale(1.06)}
.anim-fade{transform:translateY(18px)}
.anim-fade.out{transform:translateY(-18px)}

/* ظهور العناصر بالتتابع */
.rv{opacity:0}
.slide.active .rv{opacity:1;animation:rise .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 110ms + 220ms)}
.slide.out .rv{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.98)}to{opacity:1;transform:none}}

/* رأس الشريحة */
.s-head{display:flex;align-items:center;justify-content:space-between;gap:24px;flex:none}
.ttl{display:flex;flex-direction:column}
.cmt{font-family:var(--mono);color:var(--p400);font-size:21px;direction:ltr;text-align:right}
h2{font-size:56px;font-weight:800;color:var(--p900);line-height:1.15}
.chip{background:var(--p100);color:var(--p700);border:2px solid var(--p200);padding:10px 24px;border-radius:999px;font-size:26px;font-weight:800;white-space:nowrap}
.s-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:20px;position:relative}
.intro{font-size:28px;font-weight:600;color:var(--muted)}
.intro b{color:var(--p700)}

/* ==========================================================
   🔘 الأزرار العامة
   ========================================================== */
.btn{font-size:27px;font-weight:800;border:none;border-radius:18px;padding:14px 30px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;
  transition:transform .15s,box-shadow .2s,background .2s,opacity .2s}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(135deg,var(--p700),var(--p500));color:#fff;box-shadow:0 12px 24px -12px var(--p600)}
.btn-ghost{background:#fff;color:var(--p700);border:2px solid var(--p200)}
.btn-mint{background:linear-gradient(135deg,#0EA5A0,var(--mint));color:#fff;box-shadow:0 12px 24px -12px var(--mint)}
.btn.big{font-size:32px;padding:18px 40px;border-radius:22px}
.btn.sm{font-size:21px;padding:8px 18px;border-radius:14px}

/* ==========================================================
   💻 الطرفية والكود
   ========================================================== */
.term{width:920px;background:var(--code);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.term-bar{display:flex;align-items:center;gap:9px;padding:13px 20px;background:var(--code2);direction:ltr}
.term-bar i{width:14px;height:14px;border-radius:50%;background:#FF5F57}
.term-bar i:nth-child(2){background:#FEBC2E}
.term-bar i:nth-child(3){background:#28C840}
.term-bar span{color:#A59BC7;font-family:var(--mono);font-size:18px;margin-left:12px}
.term-body{font-family:var(--mono);font-size:34px;color:#EDE9FE;padding:22px 30px;min-height:136px;direction:ltr;text-align:left;line-height:1.6}
.prompt{color:var(--p400)}
.caret{display:inline-block;width:3px;height:1.05em;background:var(--mint);vertical-align:middle;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.term-out{color:#7CF5D8;direction:rtl;text-align:left;font-family:var(--font);font-weight:700;opacity:0;transform:translateY(8px);transition:.4s}
.term-out.show{opacity:1;transform:none}
.tk-str{color:#86EFAC}.tk-fn{color:#7DD3FC}.tk-kw{color:#F9A8D4}.tk-num{color:#FCD34D}.tk-cmt{color:#8E86AD;font-style:italic}
.bidi{unicode-bidi:isolate;direction:rtl;font-family:var(--font)}

/* ==========================================================
   ⏳ العد التنازلي
   ========================================================== */
.t-countdown .s-body,.t-attend .s-body{align-items:center;justify-content:center;text-align:center}
.cd{display:flex;flex-direction:column;align-items:center;gap:20px}
.cd-title{font-size:76px;font-weight:800;line-height:1.1;background:linear-gradient(135deg,var(--p800),var(--p500) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 10px}
.cd-ring{position:relative;width:380px;height:380px}
.cd-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.cd-ring circle{fill:none;stroke-width:16}
.cd-ring .trk{stroke:var(--p100)}
.cd-ring .bar{stroke:var(--p600);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.cd-num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:110px;font-weight:700;color:var(--p800);direction:ltr}
.cd-num.warn{color:var(--bad);animation:pulse 1s infinite}
.cd-bar{display:flex;gap:12px;align-items:center}
.cd-bar .btn.on{background:var(--p700);color:#fff;border-color:var(--p700)}

/* ==========================================================
   🇸🇦 النشيد الوطني
   ========================================================== */
.t-anthem .s-body{align-items:center;justify-content:center}
.anthem{display:flex;flex-direction:column;align-items:center;gap:18px}
.flag-wrap{width:1060px;border-radius:30px;overflow:hidden;box-shadow:var(--shadow);border:8px solid #fff}
.flag{width:100%;display:block}
.stand{font-size:28px;font-weight:700;color:#0B4F2C}

/* ==========================================================
   📋 التحضير
   ========================================================== */
.att-ico{font-size:190px;line-height:1.1}
.att-t{font-size:66px;font-weight:800;color:var(--p800)}
.att-sub{font-size:32px;color:var(--muted);font-weight:600}

/* ==========================================================
   🔁 مراجعة سريعة (عدة أسئلة اختيار)
   ========================================================== */
.quiz{display:grid;grid-template-columns:1fr 1fr;gap:22px;flex:1;min-height:0}
.qz{background:#fff;border-radius:26px;padding:22px 26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;border-top:8px solid var(--p400);transition:border-color .3s}
.qz.solved{border-top-color:var(--ok)}
.qz-q{font-size:29px;font-weight:800;color:var(--p900);line-height:1.4;display:flex;gap:14px;flex:1}
.qz-n{flex:none;width:46px;height:46px;border-radius:50%;background:var(--p100);color:var(--p700);display:grid;place-items:center;font-size:24px}
.qz-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;direction:ltr}
.qz-o{font-family:var(--mono);font-size:24px;font-weight:700;background:var(--p50);border:3px solid var(--p200);border-radius:16px;padding:14px 6px;cursor:pointer;transition:.2s}
.qz-o:hover{border-color:var(--p400);transform:translateY(-3px)}
.qz-o.ok{background:var(--ok-l);border-color:var(--ok);color:#14532D;animation:bump .5s}
.qz-o.bad{background:var(--bad-l);border-color:var(--bad);color:#9F1239;opacity:.75}
.qz-o.shake{animation:shake .45s}
.qz-o.dim{opacity:.4}

/* ==========================================================
   🏠 الشريحة الترحيبية والختامية
   ========================================================== */
.t-title .s-body,.t-end .s-body{align-items:center;justify-content:center;text-align:center}
.hero{display:flex;flex-direction:column;align-items:center;gap:22px}
.hero-badge{background:#fff;border:2px solid var(--p200);color:var(--p700);font-size:26px;font-weight:800;padding:10px 26px;border-radius:999px;box-shadow:var(--shadow)}
.hero h1{font-size:124px;font-weight:800;line-height:1.08;background:linear-gradient(135deg,var(--p800),var(--p500) 55%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 10px}
.hero-sub{font-size:32px;color:var(--muted);font-weight:600}
.hero-meta{display:flex;gap:18px;font-size:26px;font-weight:700;color:var(--p800)}
.hero-meta span{background:var(--p100);padding:8px 22px;border-radius:999px}
.t-end .hero h1{font-size:96px}
.hw{background:var(--amber-l);border:2px dashed var(--amber);color:#78350F;font-size:27px;padding:16px 28px;border-radius:20px;max-width:1100px;font-weight:600}

/* ==========================================================
   📋 التحضير وقرعة الأسماء
   ========================================================== */
.names{display:flex;gap:30px;flex:1;min-height:0}
.raffle{width:560px;flex:none;background:linear-gradient(160deg,var(--p800),var(--p600));border-radius:30px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:30px;box-shadow:var(--shadow)}
.raffle-top{font-size:32px;font-weight:800;opacity:.9}
.raffle-name{width:100%;min-height:150px;display:grid;place-items:center;text-align:center;background:rgba(255,255,255,.12);border:3px dashed rgba(255,255,255,.35);border-radius:24px;font-size:72px;font-weight:800;padding:10px}
.raffle-name.win{background:#fff;color:var(--p700);border:3px solid #fff;animation:bump .5s}
.raffle .btn-primary{background:#fff;color:var(--p700)}
.raffle-opts{display:flex;gap:16px;align-items:center}
.chk{font-size:22px;font-weight:700;display:flex;gap:8px;align-items:center;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--mint)}
.roster{flex:1;background:#fff;border-radius:30px;padding:26px 28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.roster-head{display:flex;align-items:center;gap:18px;font-size:30px}
.roster-head .count{font-size:22px;color:var(--muted);flex:1}
.roster-head .count b{color:var(--p700)}
.roster-tip{font-size:21px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;overflow-y:auto;flex:1}
.chip-n{font-size:23px;font-weight:700;padding:8px 16px;border-radius:999px;background:var(--p50);border:2px solid var(--p200);cursor:pointer;transition:.2s}
.chip-n:hover{border-color:var(--p500)}
.chip-n.picked{background:var(--mint-l);border-color:var(--mint)}
.chip-n.absent{background:#F1F0F4;color:#A39DB5;text-decoration:line-through;border-color:#E2E0EA}

/* ==========================================================
   🃏 البطاقات القابلة للقلب
   ========================================================== */
.lead{flex:none}
.cards{display:grid;gap:22px;flex:1;min-height:0;grid-auto-rows:1fr}
.cols-2{grid-template-columns:repeat(2,1fr)}.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-4{grid-template-columns:repeat(4,1fr)}.cols-5{grid-template-columns:repeat(5,1fr)}
.card{perspective:1400px;background:none;border:none;cursor:pointer;min-height:0;transition:transform .2s}
.card:hover{transform:translateY(-5px)}
.card-in{position:relative;width:100%;height:100%;transition:transform .65s cubic-bezier(.3,1.25,.4,1);transform-style:preserve-3d}
.card.flipped .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 22px 30px;gap:10px;box-shadow:var(--shadow)}
.front{background:#fff;border:3px solid var(--p200);color:var(--p900);font-size:29px;font-weight:800;line-height:1.35}
.front::after{content:'👆 اضغطي';position:absolute;bottom:10px;font-size:17px;color:var(--p400);font-weight:700}
.back{background:linear-gradient(135deg,var(--p700),var(--p500));color:#fff;transform:rotateY(180deg);font-size:32px;font-weight:800;line-height:1.3}
.card:nth-child(3n+2) .back{background:linear-gradient(135deg,#0F9E94,var(--mint))}
.card:nth-child(3n) .back{background:linear-gradient(135deg,#DB2777,var(--pink))}
.face small{font-size:22px;font-weight:600;opacity:.92;line-height:1.4}
.fe{font-size:56px;line-height:1}
.shp{width:190px;height:auto}
.bridge{flex:none;background:linear-gradient(90deg,var(--p100),#fff);border-inline-start:8px solid var(--p500);border-radius:18px;padding:14px 24px;font-size:26px;font-weight:700;color:var(--p900)}
.py-hero{display:flex;align-items:center;gap:22px;background:var(--code);color:#fff;border-radius:24px;padding:16px 28px;box-shadow:var(--shadow)}
.py-ico{font-size:64px}
.py-hero b{font-family:var(--mono);font-size:44px;color:#FCD34D;display:block;direction:ltr;text-align:right}
.py-hero span{font-size:25px;opacity:.9}

/* ==========================================================
   🎯 قائمة الأهداف
   ========================================================== */
.olist{display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center}
.orow{display:flex;align-items:center;gap:22px;background:#fff;border-radius:22px;padding:14px 26px;box-shadow:var(--shadow);cursor:pointer;border:3px solid transparent;transition:.25s}
.orow:hover{border-color:var(--p200)}
.onum{font-family:var(--mono);font-size:26px;color:var(--p400);font-weight:700}
.oico{font-size:40px}
.otxt{flex:1;font-size:30px;font-weight:700}
.ochk{width:46px;height:46px;border-radius:50%;border:3px solid var(--p200);display:grid;place-items:center;color:transparent;font-size:26px;transition:.25s}
.orow.done{background:var(--ok-l);border-color:#86EFAC}
.orow.done .ochk{background:var(--ok);border-color:var(--ok);color:#fff;animation:bump .4s}

/* ==========================================================
   🤖 ماذا تتوقعين
   ========================================================== */
.predict{display:flex;gap:44px;flex:1;align-items:center}
.robot{width:480px;flex:none;display:flex;flex-direction:column;align-items:center;gap:24px}
.robot-face{font-size:220px;line-height:1;animation:floaty 4s ease-in-out infinite;filter:drop-shadow(0 20px 20px rgba(76,29,149,.25))}
.robot.err .robot-face{animation:shake .5s 2}
.bubble{position:relative;background:#fff;border:3px solid var(--p300);border-radius:26px;padding:18px 30px;font-size:34px;font-weight:800;color:var(--p800);box-shadow:var(--shadow)}
.bubble::before{content:'الأمر:';display:block;font-size:20px;color:var(--muted)}
.predict-side{flex:1;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.q-big{font-size:42px;font-weight:800;color:var(--p900);line-height:1.35}
.hint-line{font-size:26px;color:var(--muted)}
.reveal-box{display:none;flex-direction:column;gap:14px;width:100%}
.reveal-box.show{display:flex;animation:rise .6s}
.robot-say{background:var(--bad-l);color:#9F1239;border-radius:18px;padding:14px 22px;font-size:28px;font-weight:700}
.key-idea{background:var(--mint-l);color:#115E59;border-radius:18px;padding:14px 22px;font-size:29px;font-weight:600}
.bridge-q{background:var(--p100);color:var(--p900);border-radius:18px;padding:14px 22px;font-size:29px;font-weight:600}

/* ==========================================================
   🔢 ترتيب الخطوات + المخطط الانسيابي
   ========================================================== */
.order{display:flex;gap:34px;flex:1;min-height:0}
.order-main{flex:1;display:flex;flex-direction:column;gap:18px;min-width:0}
.task{background:#fff;border-radius:22px;padding:16px 26px;font-size:27px;font-weight:600;box-shadow:var(--shadow);border-inline-start:8px solid var(--p500);line-height:1.45}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-content:start}
.tile{position:relative;background:#fff;border:3px solid var(--p200);border-radius:20px;padding:14px 22px;padding-inline-start:78px;font-size:26px;font-weight:700;text-align:right;cursor:pointer;min-height:76px;display:flex;align-items:center;gap:12px;transition:.2s}
.tile:hover{border-color:var(--p400);transform:translateY(-3px)}
.tile .badge{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:3px dashed var(--p300);display:grid;place-items:center;font-family:var(--mono);font-size:24px;font-weight:700;color:#fff}
.tile .tt{flex:1}
.tile.on{border-color:var(--p500);background:var(--p50)}
.tile.on .badge{background:var(--p600);border:3px solid var(--p600);animation:bump .3s}
.tile.ok{border-color:var(--ok);background:var(--ok-l)}
.tile.ok .badge{background:var(--ok);border-color:var(--ok)}
.tile.bad{border-color:var(--bad);background:var(--bad-l);animation:shake .45s}
.tile.bad .badge{background:var(--bad);border-color:var(--bad)}
.mini-shape{width:44px;height:26px;flex:none}
.mini-shape.start{background:var(--sh-start);border-radius:999px}
.mini-shape.io{background:var(--sh-io);clip-path:polygon(22% 0,100% 0,78% 100%,0 100%)}
.mini-shape.proc{background:var(--sh-proc)}
.order-bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.mini-clock{font-family:var(--mono);font-size:44px;font-weight:700;color:var(--p700);direction:ltr;background:#fff;border-radius:16px;padding:2px 20px;box-shadow:var(--shadow)}
.mini-clock.warn,.clock.warn{color:var(--amber);animation:pulse 1s infinite}
.mini-clock.done,.clock.done{color:var(--pink)}
.success-msg{display:none;background:var(--ok-l);color:#14532D;border-radius:18px;padding:14px 22px;font-size:26px;font-weight:700}
.success-msg.show{display:block;animation:rise .5s}
.flowpanel{width:520px;flex:none;border-radius:26px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px;
  background-color:#fff;background-image:linear-gradient(var(--p100) 1px,transparent 1px),linear-gradient(90deg,var(--p100) 1px,transparent 1px);background-size:26px 26px}
.flow-title{font-size:24px;font-weight:800;color:var(--p700);text-align:center}
.flow{flex:1;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.flow.shake{animation:shake .45s}
.flow-empty{margin:auto;font-size:23px;color:var(--muted);text-align:center;padding:20px}
.fnode{min-width:230px;max-width:460px;padding:11px 26px;font-size:23px;font-weight:700;text-align:center;animation:pop-in .35s cubic-bezier(.3,1.5,.5,1);position:relative}
.fnode.start{background:var(--sh-start);border-radius:999px}
.fnode.io{background:var(--sh-io);clip-path:polygon(7% 0,100% 0,93% 100%,0 100%);padding:11px 48px}
.fnode.proc{background:var(--sh-proc);border-radius:3px}
.fnode.plain{background:var(--p100);border-radius:14px}
.fnode.bad{background:var(--bad-l)!important;color:var(--bad)}
.fnode.ok{box-shadow:inset 0 0 0 3px rgba(22,163,74,.6)}
.farrow{width:3px;height:22px;background:#7A7396;position:relative;flex:none}
.farrow::after{content:'';position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top:9px solid #7A7396;border-bottom:0}

/* ==========================================================
   ⚙️ المحول البرمجي
   ========================================================== */
.def{flex:none;background:#fff;border-radius:22px;padding:18px 28px;font-size:29px;font-weight:700;box-shadow:var(--shadow);border-inline-start:10px solid var(--pink);color:var(--p900);line-height:1.45}
.def b{color:var(--pink)}
.comp{display:flex;gap:18px;align-items:stretch;flex:1;min-height:0}
.comp-box{flex:1;background:var(--code);color:#fff;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow)}
.comp-box small{font-size:21px;opacity:.75}
.cb-title{font-size:28px;font-weight:800}
.cb-title.dark{color:var(--p900)}
.en{font-family:var(--mono);font-size:22px;color:var(--p600)}
.code-mini{font-family:var(--mono);font-size:36px;direction:ltr;background:var(--code2);padding:16px 26px;border-radius:14px}
.binary{font-family:var(--mono);font-size:25px;color:#7CF5D8;direction:ltr;min-height:150px;white-space:pre-wrap;letter-spacing:1px;line-height:1.5}
.comp-mid{width:290px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.gear{font-size:110px;line-height:1}
.gear.spin{animation:spin 1.1s linear infinite}
.comp-arrow{align-self:center;font-size:46px;color:var(--p400)}
.qa{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--p50);border:2px dashed var(--p300);border-radius:22px;padding:14px 24px}
.qa-q{flex:1;font-size:27px;font-weight:700;color:var(--p900)}
.qa-a{display:none;width:100%;font-size:27px;font-weight:800;color:var(--p700)}
.qa.open .qa-a{display:block;animation:rise .5s}

/* ==========================================================
   🌐 لغات البرمجة
   ========================================================== */
.langs{display:flex;gap:26px;flex:1;min-height:0}
.lang-tabs{display:flex;flex-direction:column;gap:12px;width:290px;flex:none}
.lang-tab{font-size:25px;font-weight:800;padding:14px 20px;border-radius:16px;background:#fff;border:3px solid var(--p200);text-align:right;cursor:pointer;display:flex;gap:12px;align-items:center;transition:.2s}
.lang-tab:hover{border-color:var(--p400)}
.lang-tab.on{background:var(--p600);color:#fff;border-color:var(--p600);transform:translateX(-6px)}
.lang-view{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.editor{background:var(--code);border-radius:22px;overflow:hidden;box-shadow:var(--shadow)}
.lang-code{font-family:var(--mono);font-size:25px;color:#EDE9FE;padding:20px 28px;direction:ltr;text-align:left;white-space:pre;line-height:1.45;height:356px;animation:pop-in .35s}
.lang-meta{display:flex;gap:12px}
.linecount{background:var(--amber-l);color:#92400E;font-size:23px;font-weight:800;padding:6px 18px;border-radius:999px}
.scratch{direction:rtl;display:flex;flex-direction:column;align-items:flex-start;padding-top:40px;font-family:var(--font)}
.scratch .hat{background:#FFBF00;color:#5c4400;font-size:30px;font-weight:800;padding:18px 34px 14px;border-radius:40px 40px 10px 10px}
.scratch .say{background:#9966FF;color:#fff;font-size:30px;font-weight:800;padding:16px 28px;border-radius:10px;display:flex;gap:12px;align-items:center}
.scratch .say span{background:#fff;color:#555;border-radius:999px;padding:2px 16px}

/* ==========================================================
   🧩 المدخلات والمخرجات
   ========================================================== */
.io-tabs{display:flex;gap:12px;flex:none}
.io-tab{font-size:24px;font-weight:800;padding:10px 22px;border-radius:999px;background:#fff;border:2px solid var(--p200);cursor:pointer}
.io-tab.on{background:var(--p600);color:#fff;border-color:var(--p600)}
.io-row{display:flex;gap:16px;flex:1;min-height:0}
.io-box{flex:1;border-radius:28px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;border:none;border-top:12px solid var(--sh-io);padding:20px;transition:.25s}
.io-box:hover{transform:translateY(-5px)}
.io-alg{border-top-color:var(--sh-proc)}
.io-out{border-top-color:var(--p400)}
.io-box .lab{font-size:34px;font-weight:800;color:var(--p900)}
.io-box .qm{font-size:90px;opacity:.35}
.io-box .em{font-size:96px;line-height:1.1;display:none}
.io-box .desc{font-size:29px;font-weight:700;color:var(--p700);display:none}
.io-box.open .qm{display:none}
.io-box.open .em,.io-box.open .desc{display:block;animation:pop-in .45s cubic-bezier(.3,1.5,.5,1)}
.io-arrow{align-self:center;font-size:56px;color:var(--p400)}
.io-foot{display:flex;justify-content:center;flex:none}

/* ==========================================================
   🧠 العصف الذهني
   ========================================================== */
.bs{flex:1;display:flex;flex-direction:column;gap:14px;min-height:0}
.bs-board{flex:1;position:relative;background:#fff;border-radius:28px;box-shadow:var(--shadow);overflow:hidden;
  background-image:radial-gradient(var(--p100) 2px,transparent 2px);background-size:28px 28px}
.bs-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:430px;padding:26px 28px;border-radius:36px;background:linear-gradient(135deg,var(--p700),var(--p500));color:#fff;font-size:33px;font-weight:800;text-align:center;box-shadow:0 20px 40px -18px var(--p700);animation:breathe 4s ease-in-out infinite;line-height:1.35}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(1.03)}}
.note{position:absolute;width:236px;min-height:72px;padding:12px 16px;font-size:23px;font-weight:800;border-radius:14px;box-shadow:0 10px 20px -10px rgba(0,0,0,.35);transform:rotate(var(--r));
  animation:note-in .5s cubic-bezier(.3,1.5,.5,1) backwards;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;border:none;transition:transform .2s}
.note:hover{transform:rotate(0) scale(1.07);z-index:3}
@keyframes note-in{from{opacity:0;transform:scale(.3) rotate(var(--r))}to{opacity:1;transform:scale(1) rotate(var(--r))}}
.bs-bar{display:flex;gap:12px;align-items:center;flex:none}
.bs-bar input,.inputs input,.edit-ta{font-size:27px;padding:12px 20px;border-radius:16px;border:3px solid var(--p200);outline:none;background:#fff;color:var(--ink)}
.bs-bar input{flex:1}
.bs-bar input:focus,.inputs input:focus,.edit-ta:focus{border-color:var(--p500)}
.bs-count{font-size:22px;font-weight:800;color:var(--p700);background:var(--p100);padding:8px 16px;border-radius:999px;white-space:nowrap}

/* ==========================================================
   👭 فكري زاوجي شاركي
   ========================================================== */
.tps{flex:1;display:flex;flex-direction:column;gap:20px;min-height:0;position:relative}
.tps-task{display:flex;align-items:center;gap:20px;background:linear-gradient(90deg,var(--amber-l),#fff);border-radius:24px;padding:16px 26px;font-size:30px;box-shadow:var(--shadow);flex:none}
.tt-ico{font-size:58px}
.tps-row{display:flex;gap:20px;flex:1;min-height:0}
.phase{flex:1;background:#fff;border-radius:26px;padding:20px;text-align:center;border:3px solid transparent;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:.25s}
.phase:hover{border-color:var(--p200)}
.phase .pe{font-size:78px;line-height:1}
.phase b{font-size:36px;color:var(--p900)}
.phase small{font-size:22px;color:var(--muted);font-weight:600}
.phase .dur{font-family:var(--mono);background:var(--p100);color:var(--p700);padding:4px 16px;border-radius:999px;font-size:21px;direction:ltr}
.phase.active{border-color:var(--p500);background:var(--p50);transform:translateY(-8px)}
.tps-timer{width:330px;flex:none;background:var(--code);color:#fff;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;box-shadow:var(--shadow)}
.tt-label{font-size:24px;font-weight:700;opacity:.85;text-align:center;padding:0 10px}
.clock{font-family:var(--mono);font-size:92px;font-weight:700;direction:ltr}
.tt-btns{display:flex;gap:10px}
.tps-foot{display:flex;justify-content:center;flex:none}
.ans-panel{position:absolute;inset:0;background:rgba(251,250,255,.97);border-radius:26px;border:3px solid var(--p200);display:none;flex-direction:column;gap:16px;padding:26px 34px;z-index:5}
.ans-panel.show{display:flex;animation:pop-in .4s}
.ans-head{display:flex;justify-content:space-between;align-items:center;font-size:32px;color:var(--p800)}
.ans-list{columns:2;column-gap:40px;font-size:27px;font-weight:700;padding-inline-start:44px;line-height:1.5}
.ans-list li{margin-bottom:12px;break-inside:avoid}
.ans-list li::marker{color:var(--p500);font-family:var(--mono)}

/* ==========================================================
   ▶ مشغّل الكود
   ========================================================== */
.runner{display:flex;gap:28px;flex:1;min-height:0}
.run-side{width:400px;flex:none;display:flex;flex-direction:column;gap:16px}
.prob{background:#fff;border-radius:22px;padding:18px 22px;box-shadow:var(--shadow);font-size:26px;font-weight:600;line-height:1.45}
.prob-t{font-weight:800;color:var(--p700)}
.formula{margin-top:10px;background:var(--amber-l);padding:10px 14px;border-radius:12px;font-weight:800;font-size:26px;text-align:center;color:#78350F}
.inputs{display:flex;gap:12px}
.inputs label{flex:1;background:#fff;border-radius:18px;padding:12px;font-size:23px;font-weight:800;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);color:var(--p800)}
.inputs input{width:100%;font-family:var(--mono);font-size:34px;text-align:center;direction:ltr;padding:6px 10px}
.legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lg{font-size:20px;font-weight:800;padding:4px 14px;border-radius:999px}
.lg.in,.lg.out{background:var(--sh-io);color:#2F4A12}
.lg.proc{background:var(--sh-proc);color:#7C3E0E}
.run-main{flex:1;display:flex;flex-direction:column;gap:14px;min-width:0}
.code-lines{padding:12px 0;font-family:var(--mono);font-size:24px;color:#EDE9FE;direction:ltr}
.cl{display:flex;align-items:center;gap:16px;padding:5px 22px;position:relative;transition:background .25s}
.cl .ln{color:#6E6593;width:26px;text-align:right;flex:none}
.cl .cc{flex:1;white-space:pre}
.cl .ktag{font-family:var(--font);font-size:17px;padding:2px 12px;border-radius:999px;font-weight:800;flex:none}
.cl[data-kind=out] .ktag,.cl[data-kind=in] .ktag{background:var(--sh-io);color:#2F4A12}
.cl[data-kind=calc] .ktag{background:var(--sh-proc);color:#7C3E0E}
.cl.now{background:rgba(139,92,246,.38)}
.cl.now::before{content:'▶';position:absolute;left:4px;color:#7CF5D8;font-size:14px}
.calc-badge{color:var(--amber);margin-left:14px;font-size:21px}
.console{flex:1;min-height:0;background:#0F0D1A;border-radius:22px;padding:14px 24px;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.console-t{color:#A59BC7;font-size:19px;margin-bottom:6px}
.console-body{font-size:27px;color:#fff;line-height:1.55;font-weight:700}
.con-line{animation:rise .3s}
.echo{font-family:var(--mono);color:#7CF5D8;margin-inline-start:12px}
.con-line.final{color:#FCD34D}

/* ==========================================================
   ❓ أسئلة الاختيار من متعدد
   ========================================================== */
.mcq{display:flex;flex-direction:column;gap:24px;flex:1;justify-content:center}
.q-card{background:linear-gradient(135deg,var(--p800),var(--p500));color:#fff;border-radius:28px;padding:26px 36px;font-size:40px;font-weight:800;display:flex;align-items:center;gap:24px;box-shadow:var(--shadow);line-height:1.35}
.q-ico{font-size:56px;background:rgba(255,255,255,.18);width:92px;height:92px;border-radius:24px;display:grid;place-items:center;flex:none}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.opt{font-size:32px;font-weight:800;background:#fff;border:3px solid var(--p200);border-radius:22px;padding:18px 24px;display:flex;align-items:center;gap:18px;cursor:pointer;text-align:right;transition:.2s;min-height:104px}
.opt:hover{border-color:var(--p400);transform:translateY(-4px)}
.opt .ol{width:48px;height:48px;border-radius:50%;background:var(--p100);color:var(--p700);display:grid;place-items:center;font-size:26px;flex:none}
.opt .oi{font-size:44px;min-width:64px;text-align:center;display:grid;place-items:center}
.opt .oi svg{width:96px;height:auto}
.opt.ok{background:var(--ok-l);border-color:var(--ok);color:#14532D;animation:bump .5s}
.opt.ok .ol{background:var(--ok);color:#fff}
.opt.bad{background:var(--bad-l);border-color:var(--bad);color:#9F1239;opacity:.75}
.opt.shake{animation:shake .45s}
.opt.dim{opacity:.4}
.explain{display:none;background:var(--mint-l);border-radius:20px;padding:14px 24px;font-size:27px;font-weight:700;color:#115E59;align-items:center;gap:16px}
.explain.show{display:flex;animation:rise .5s}
.explain span{flex:1}

/* ==========================================================
   ✅❌ صح أم خطأ
   ========================================================== */
.tf{display:flex;flex-direction:column;gap:12px;flex:1;justify-content:center}
.tf-row{display:flex;align-items:center;gap:18px;background:#fff;border-radius:20px;padding:12px 20px;box-shadow:var(--shadow);border:3px solid transparent;transition:.25s}
.tf-num{width:46px;height:46px;border-radius:50%;background:var(--p100);color:var(--p700);display:grid;place-items:center;font-family:var(--mono);font-size:22px;font-weight:700;flex:none}
.tf-txt{flex:1;font-size:27px;font-weight:700;line-height:1.4}
.tf-txt small{display:none;font-size:21px;color:#15803D;font-weight:700}
.tf-row.done .tf-txt small{display:block;animation:rise .4s}
.tf-btn{font-size:23px;font-weight:800;padding:10px 20px;border-radius:14px;border:3px solid;background:#fff;cursor:pointer;transition:.2s}
.tf-btn:hover{transform:translateY(-2px)}
.tf-btn.t{border-color:#86EFAC;color:var(--ok)}
.tf-btn.f{border-color:#FDA4AF;color:var(--bad)}
.tf-btn.pick{color:#fff}
.tf-btn.t.pick{background:var(--ok);border-color:var(--ok)}
.tf-btn.f.pick{background:var(--bad);border-color:var(--bad)}
.tf-row.done{border-color:#86EFAC;background:var(--ok-l)}
.tf-row.shake{animation:shake .45s;border-color:#FDA4AF}
.tf-score{align-self:center;font-size:26px;font-weight:800;color:var(--p700);background:var(--p100);padding:8px 26px;border-radius:999px;flex:none}

/* ==========================================================
   ⚡ التقييم الفوري
   ========================================================== */
.rate{display:flex;gap:28px;flex:1;min-height:0}
.rate-btns{flex:1;display:flex;gap:18px}
.rbtn{flex:1;background:#fff;border-radius:28px;border:3px solid var(--p200);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;box-shadow:var(--shadow);transition:.2s;padding:16px}
.rbtn:hover{transform:translateY(-6px);border-color:var(--p400)}
.rbtn .re{font-size:104px;line-height:1}
.rbtn .rl{font-size:27px;font-weight:800;text-align:center}
.rbtn .rc{font-family:var(--mono);font-size:50px;color:var(--p600);font-weight:700}
.rbtn.bump .re{animation:bump .4s}
.exit{width:470px;flex:none;background:var(--code);color:#fff;border-radius:28px;padding:30px;display:flex;flex-direction:column;gap:18px;justify-content:center;box-shadow:var(--shadow)}
.exit .eq{font-size:30px;font-weight:800;line-height:1.45}
.exit .ea{display:none;font-size:26px;color:#7CF5D8;font-weight:700;line-height:1.6}
.exit.open .ea{display:block;animation:rise .5s}

/* ==========================================================
   🎛️ شريط التحكم والمؤشرات (خارج المسرح)
   ========================================================== */
#progress{position:fixed;top:0;left:0;right:0;height:5px;background:rgba(124,58,237,.12);z-index:40}
#progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--p500),var(--pink));transition:width .5s;margin-right:auto;margin-left:0}
#controls{position:fixed;bottom:clamp(8px,1.8vh,22px);left:50%;transform:translate(-50%,0);display:flex;align-items:center;gap:6px;padding:7px;direction:ltr;
  background:rgba(255,255,255,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:999px;box-shadow:0 12px 30px -12px rgba(46,16,101,.45);border:1px solid var(--p200);z-index:50;transition:opacity .4s,transform .4s}
body:not(.ui-on) #controls{opacity:0;transform:translate(-50%,30px);pointer-events:none}
.cbtn{font-size:clamp(14px,1.9vmin,22px);font-weight:800;border:none;background:var(--p100);color:var(--p800);border-radius:999px;padding:.55em 1.1em;cursor:pointer;display:flex;align-items:center;gap:.35em;transition:.15s}
.cbtn:hover{background:var(--p200)}
.cbtn:active{transform:scale(.92)}
.cbtn:disabled{opacity:.35;cursor:default}
.cbtn.icon{background:transparent;font-size:clamp(17px,2.5vmin,28px);padding:.35em .55em}
.cbtn.icon:hover{background:var(--p100)}
.cbtn.clap{background:linear-gradient(135deg,#FDE68A,#FBBF24);font-size:clamp(18px,2.6vmin,30px);padding:.3em .7em}
#counter{font-family:var(--mono);font-weight:700;color:var(--p700);padding:0 .6em;font-size:clamp(14px,1.9vmin,22px);white-space:nowrap}
.sep{width:1px;height:1.6em;background:var(--p200)}
#hint{position:fixed;top:clamp(10px,1.6vh,18px);left:clamp(10px,1.4vw,18px);font-size:clamp(11px,1.45vmin,16px);background:rgba(46,16,101,.78);color:#fff;padding:.45em 1em;border-radius:999px;z-index:40;transition:opacity .4s;font-weight:700}
body:not(.ui-on) #hint{opacity:0}

/* ==========================================================
   ✨ التأثيرات (تصفيق – احتفال – رسائل)
   ========================================================== */
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.conf{position:absolute;top:0;animation:conf-fall linear forwards}
@keyframes conf-fall{from{transform:translate(0,-12vh) rotate(0)}to{transform:translate(var(--dx),112vh) rotate(var(--rot))}}
.clap-p{position:absolute;opacity:0;animation:clap-rise 1.8s ease-out forwards;font-size:clamp(22px,4.2vmin,50px)}
@keyframes clap-rise{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--s)) rotate(18deg)}}
.clap-big{position:absolute;left:50%;top:50%;font-size:24vmin;animation:clap-big 1.1s ease-out forwards}
@keyframes clap-big{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(-8deg)}45%{transform:translate(-50%,-50%) scale(.95) rotate(8deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
.toast{position:absolute;left:50%;top:26px;transform:translate(-50%,-30px) scale(.9);opacity:0;background:#fff;border:3px solid var(--p300);color:var(--p800);font-size:38px;font-weight:800;padding:14px 40px;border-radius:999px;box-shadow:0 20px 40px -16px rgba(46,16,101,.45);z-index:85;transition:.35s cubic-bezier(.3,1.4,.5,1);white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.ok{border-color:var(--ok);color:#15803D}
.toast.bad{border-color:var(--p400);color:var(--p700)}

/* النوافذ المنبثقة (داخل المسرح) */
.modal{position:absolute;inset:0;background:rgba(30,16,60,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:none;place-items:center;z-index:80}
.modal.open{display:grid}
.modal-card{width:860px;background:#fff;border-radius:34px;padding:38px 44px;display:flex;flex-direction:column;align-items:center;gap:24px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5);animation:pop-in .4s cubic-bezier(.3,1.4,.5,1)}
.m-title{font-size:40px;font-weight:800;color:var(--p800)}
.modal .raffle-name{background:var(--p50);border-color:var(--p300);color:var(--p800);font-size:84px;min-height:170px}
.modal .raffle-name.win{background:linear-gradient(135deg,var(--p700),var(--p500));color:#fff;border-color:transparent}
.m-btns{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.m-note{font-size:22px;color:var(--muted)}
.edit-ta{width:100%;height:380px;resize:none;line-height:1.6;font-size:26px}

/* حركات عامة */
@keyframes pop-in{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.55}}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const h = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const shuffleNotSorted = items => { let a; let tries = 0; do { a = shuffle(items); tries++; } while (items.length > 1 && a.every((x, i) => x === items[i]) && tries < 20); return a; };
const arLines = n => n === 1 ? 'سطر واحد' : n === 2 ? 'سطران' : n <= 10 ? n + ' أسطر' : n + ' سطرًا';

/* ---------- تلوين الكود ---------- */
function hlKw(s) {
  return s.replace(/\b(print|input|int|puts|return|class|static|void|main|Main|include|WriteLine|TextWindow|System|Console)\b/g, '<span class="tk-fn">$1</span>')
          .replace(/\b(\d+)\b/g, '<span class="tk-num">$1</span>');
}
function highlightLine(line) {
  const t = line.trim();
  if (/^(#(?!include)|\/\/|\/\*|')/.test(t)) return '<span class="tk-cmt">' + esc(line) + '</span>';
  let out = '', last = 0, m; const re = /"([^"]*)"/g;
  while ((m = re.exec(line))) {
    out += hlKw(esc(line.slice(last, m.index)));
    const inner = /[\u0600-\u06FF]/.test(m[1]) ? '<span class="bidi">' + esc(m[1]) + '</span>' : esc(m[1]);
    out += '<span class="tk-str">"' + inner + '"</span>';
    last = re.lastIndex;
  }
  return out + hlKw(esc(line.slice(last)));
}
const highlightCode = code => code.split('\n').map(highlightLine).join('\n');

/* كتابة الكود حرفًا حرفًا */
function typeCode(el, code, done, speed = 55) {
  let i = 0, stop = false, t;
  const chars = Array.from(code);  // يحافظ على الإيموجي كاملة
  el.innerHTML = '';
  const step = () => { if (stop) return; i++; el.innerHTML = highlightCode(chars.slice(0, i).join('')); if (i < chars.length) t = setTimeout(step, speed); else if (done) done(); };
  t = setTimeout(step, 900);
  return { cancel() { stop = true; clearTimeout(t); } };
}

/* ---------- 🔊 الأصوات (Web Audio API بدون ملفات خارجية) ---------- */
const SFX = {
  ctx: null, out: null, muted: false, _nb: null,
  ac() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      this.ctx = new AC(); this.out = this.ctx.createGain(); this.out.gain.value = .8; this.out.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.muted ? null : this.ctx;
  },
  noise() {
    if (this._nb) return this._nb;
    const c = this.ctx, len = Math.floor(c.sampleRate * .25), b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return (this._nb = b);
  },
  tone(f, t, d, type = 'sine', vol = .25) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0008, t + d);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + d + .05);
    return o;
  },
  /* تصفيقة واحدة = دفقة ضجيج قصيرة مفلترة */
  clapOne(t, vol) {
    const c = this.ctx, src = c.createBufferSource(), bp = c.createBiquadFilter(), hp = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noise();
    bp.type = 'bandpass'; bp.frequency.value = 900 + Math.random() * 1500; bp.Q.value = .9;
    hp.type = 'highpass'; hp.frequency.value = 450;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .002); g.gain.exponentialRampToValueAtTime(.001, t + .08 + Math.random() * .06);
    src.connect(bp).connect(hp).connect(g).connect(this.out);
    src.start(t, Math.random() * .08, .15);
  },
  clap() { const c = this.ac(); if (!c) return; const now = c.currentTime + .02, N = 48;
    for (let i = 0; i < N; i++) { const p = i / N; this.clapOne(now + p * 1.5 + Math.random() * .06, (.5 + Math.random() * .5) * (1 - p * .7)); } },
  success() { const c = this.ac(); if (!c) return; const t = c.currentTime; [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone(f, t + i * .09, .4, 'triangle', .22)); },
  wrong() { const c = this.ac(); if (!c) return; const t = c.currentTime; this.tone(330, t, .25, 'sine', .2); this.tone(247, t + .16, .4, 'sine', .2); },
  tick() { const c = this.ac(); if (!c) return; this.tone(1500, c.currentTime, .04, 'square', .04); },
  pop() { const c = this.ac(); if (!c) return; const t = c.currentTime; const o = this.tone(480, t, .14, 'sine', .16); o.frequency.exponentialRampToValueAtTime(900, t + .1); },
  bell() { const c = this.ac(); if (!c) return; const t = c.currentTime; this.tone(880, t, 1.4, 'sine', .25); this.tone(1320, t, 1, 'sine', .1); this.tone(880, t + .45, 1.4, 'sine', .2); }
};

const FX = $('#fx');
function confetti(n = 90) {
  const colors = ['#7C3AED', '#A78BFA', '#EC4899', '#14B8A6', '#F59E0B', '#FDE68A', '#C4B5FD'];
  for (let i = 0; i < n; i++) {
    const p = h('i', 'conf'); const w = .8 + Math.random() * .8;
    p.style.left = Math.random() * 100 + 'vw';
    p.style.width = w + 'vmin'; p.style.height = (w * 1.6) + 'vmin';
    p.style.background = colors[i % colors.length];
    if (Math.random() < .3) p.style.borderRadius = '50%';
    p.style.setProperty('--dx', (Math.random() * 24 - 12) + 'vw');
    p.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    p.style.animationDuration = (1.8 + Math.random() * 1.4) + 's';
    p.style.animationDelay = Math.random() * .3 + 's';
    FX.append(p); setTimeout(() => p.remove(), 3800);
  }
}
function clap() {
  SFX.clap();
  let x = innerWidth / 2, y = innerHeight - 70;
  if (document.body.classList.contains('ui-on')) { const r = $('#btnClap').getBoundingClientRect(); x = r.left + r.width / 2; y = r.top; }
  for (let i = 0; i < 16; i++) {

    e.style.left = x + 'px'; e.style.top = y + 'px';

    e.style.animationDelay = Math.random() * .35 + 's';
    FX.append(e); setTimeout(() => e.remove(), 2600);
  }
  const big = h('div', 'clap-big', '👏'); FX.append(big); setTimeout(() => big.remove(), 1200);
}
function toast(msg, kind = 'ok') {

/* ---------- ⏱️ مؤقّت ---------- */
function Timer(disp, onEnd) {
  let left = 0, id = null;
  const show = () => (disp.textContent = fmt(Math.max(left, 0)));
  const tick = () => {
    left--; show();
    if (left > 0 && left <= 10) { disp.classList.add('warn'); SFX.tick(); }
    if (left <= 0) { clearInterval(id); id = null; disp.classList.remove('warn'); disp.classList.add('done'); SFX.bell(); if (onEnd) onEnd(); }
  };
  return {
    start(s) { clearInterval(id); left = s; disp.classList.remove('warn', 'done'); show(); id = setInterval(tick, 1000); },
    pause() { clearInterval(id); id = null; },
    resume() { if (!id && left > 0) id = setInterval(tick, 1000); },
    set(s) { clearInterval(id); id = null; left = s; disp.classList.remove('warn', 'done'); show(); },
    get running() { return !!id; }, get left() { return left; }
  };
}

const STU = {
  list: [], noRepeat: true, spinning: false, subs: [],
  load() {
    let names = null;
    try { names = JSON.parse(localStorage.getItem('mb_students') || 'null'); } catch (e) {}
    if (!Array.isArray(names) || !names.length) names = LESSON.students;
    this.list = names.map(n => ({ name: n, absent: false, picked: false }));
  },
  setNames(arr, save = true) {
    this.list = arr.map(n => ({ name: n, absent: false, picked: false }));
    try { save ? localStorage.setItem('mb_students', JSON.stringify(arr)) : localStorage.removeItem('mb_students'); } catch (e) {}
    this.emit();
  },
  resetPicks() { this.list.forEach(s => (s.picked = false)); this.emit(); },
  emit() { this.subs.forEach(f => f()); }
};
function drawName(disp) {
  if (STU.spinning) return;
  const present = STU.list.filter(s => !s.absent);
  const pool = present.filter(s => !(STU.noRepeat && s.picked));
  if (!pool.length) { disp.classList.remove('win'); disp.textContent = present.length ? 'انتهت الأسماء! اضغطي ↺' : 'لا توجد أسماء'; SFX.wrong(); return; }
  STU.spinning = true;
  const winner = pool[Math.floor(Math.random() * pool.length)];
  let n = 0; const total = 22;
  disp.classList.remove('win');
  (function step() {
    if (n < total) { disp.textContent = present[Math.floor(Math.random() * present.length)].name; SFX.tick(); n++; setTimeout(step, 45 + n * n * .45); }
    else { disp.textContent = winner.name; disp.classList.add('win'); winner.picked = true; STU.spinning = false; SFX.success(); confetti(40); STU.emit(); }
  })();
}

    const tilesEl = $('.js-tiles', b), flowEl = $('.js-flow', b), succ = $('.js-succ', b);
    const timer = c.timer ? Timer($('.js-clock', b), () => { if (!done) toast('⏰ انتهى الوقت!', 'bad'); }) : null;
    const startTimer = () => { if (timer && !started && !done) { started = true; timer.start(c.timer); SFX.pop(); } };

    items.forEach(it => {
      it.el = h('button', 'tile', `<span class="badge"></span><span class="tt">${it.text}</span>${it.shape ? `<span class="mini-shape ${it.shape}"></span>` : ''}`);
      it.el.onclick = () => toggle(it);
    });
    const layout = () => shuffleNotSorted(items).forEach(it => tilesEl.append(it.el));
    layout();

    function clearMarks() { if (!checked) return; checked = false; items.forEach(it => it.el.classList.remove('ok', 'bad')); }
    function toggle(it) {
      if (done) return;
      clearMarks(); startTimer();
      const k = seq.indexOf(it); k >= 0 ? seq.splice(k, 1) : seq.push(it);
      SFX.pop(); update();
    }
    function update() {
      items.forEach(it => { const k = seq.indexOf(it); it.el.classList.toggle('on', k >= 0); $('.badge', it.el).textContent = k >= 0 ? k + 1 : ''; });
      flowEl.innerHTML = '';
      if (!seq.length) { flowEl.innerHTML = '<div class="flow-empty">اضغطي على الخطوات بالترتيب<br>ليُبنى المخطط هنا… ✨</div>'; return; }
      seq.forEach((it, k) => { if (k) flowEl.append(h('div', 'farrow')); flowEl.append(h('div', 'fnode ' + (it.shape || 'plain'), it.text)); });
    }
    function check() {
      if (done) return;
      if (seq.length < items.length) { toast('رتّبي جميع الخطوات أولًا 😊', 'bad'); SFX.wrong(); return; }
      checked = true; let all = true; const nodes = $$('.fnode', flowEl);

      if (all) { done = true; SFX.success(); confetti(); toast('أحسنتِ! 👏 ترتيب صحيح', 'ok'); succ.classList.add('show'); if (timer) timer.pause(); }

    }

      seq = []; checked = false; done = false; started = false;
      items.forEach(it => it.el.classList.remove('ok', 'bad'));
      succ.classList.remove('show'); layout(); update();
      if (timer) timer.set(c.timer); SFX.pop();
    }
    $('.js-check', b).onclick = check;
    $('.js-reset', b).onclick = reset;
    if (c.timer) $('.js-start', b).onclick = startTimer;
    update();
    return { onLeave() { if (timer) timer.pause(); } };
  },

      <div class="tps-foot rv"><button class="btn btn-primary js-ans">📜 اعرضي الحل المقترح</button></div>
      <div class="ans-panel js-panel"><div class="ans-head"><b>📜 خوارزمية مقترحة</b><button class="btn btn-ghost sm js-close">✕ إغلاق</button></div>
        <ol class="ans-list">${c.answer.map(s => `<li>${s}</li>`).join('')}</ol></div>
    </div>`;
    const phases = $$('.phase', b), lbl = $('.js-lbl', b), pauseBtn = $('.js-pause', b);
    let cur = -1;
    const timer = Timer($('.js-clock', b), () => { lbl.textContent = '⏰ انتهى وقت «' + c.phases[cur].name + '»'; });
    phases.forEach((p, i) => (p.onclick = () => {
      cur = i; phases.forEach((x, k) => x.classList.toggle('active', k === i));
      lbl.textContent = c.phases[i].emoji + ' الآن: ' + c.phases[i].name; timer.start(c.phases[i].seconds); pauseBtn.textContent = '⏸ إيقاف'; SFX.pop();
    }));
    pauseBtn.onclick = () => { if (cur < 0) return; if (timer.running) { timer.pause(); pauseBtn.textContent = '▶ استئناف'; } else { timer.resume(); pauseBtn.textContent = '⏸ إيقاف'; } };
    $('.js-rst', b).onclick = () => { if (cur >= 0) { timer.set(c.phases[cur].seconds); pauseBtn.textContent = '▶ استئناف'; } };
    $('.js-ans', b).onclick = () => { $('.js-panel', b).classList.add('show'); SFX.success(); };
    $('.js-close', b).onclick = () => { $('.js-panel', b).classList.remove('show'); SFX.pop(); };
    return { onLeave() { timer.pause(); pauseBtn.textContent = '▶ استئناف'; } };
  },

  /* ---------- تشغيل البرنامج سطرًا سطرًا ---------- */
  runner(b, c) {
    const tag = { out: 'إخراج', in: 'إدخال', calc: 'عملية' };
    b.innerHTML = `<div class="runner">
      <div class="run-side rv">
        <div class="prob"><div class="prob-t">🎯 المشكلة</div><div>${c.problem}</div><div class="formula">${c.formula}</div></div>
        <div class="inputs">${c.inputs.map(i => `<label>${i.label}<input type="number" min="0" value="${i.def}" data-var="${i.var}"></label>`).join('')}</div>
        <button class="btn btn-mint big js-run">▶ شغّلي البرنامج</button>
        <div class="legend"><span class="lg in">إدخال / إخراج = ▱</span><span class="lg proc">عملية = ▭</span></div>
      </div>
      <div class="run-main rv">
        <div class="editor"><div class="term-bar"><i></i><i></i><i></i><span>${c.file || 'main.py'}</span></div>
          <div class="code-lines">${c.lines.map((L, i) => `<div class="cl" data-kind="${L.kind}"><span class="ln">${i + 1}</span><span class="cc">${highlightLine(L.code)}</span><span class="ktag">${tag[L.kind]}</span></div>`).join('')}</div></div>
        <div class="console"><div class="console-t">📟 الشاشة (المخرجات)</div><div class="console-body js-con"></div></div>
      </div></div>`;
    const lines = $$('.cl', b), con = $('.js-con', b), runBtn = $('.js-run', b); let running = false;
    runBtn.onclick = async () => {
      if (running) return;
      const vals = {}; let bad = false;
      $$('.inputs input', b).forEach(inp => { const n = Number(inp.value); if (inp.value === '' || isNaN(n)) bad = true; vals[inp.dataset.var] = Math.trunc(n); });
      if (bad) { toast('أدخلي أرقامًا صحيحة أولًا 😊', 'bad'); SFX.wrong(); return; }
      running = true; runBtn.style.opacity = .6; con.innerHTML = ''; $$('.calc-badge', b).forEach(x => x.remove());
      const v = {}; let last = null;
      for (let i = 0; i < c.lines.length; i++) {
        const L = c.lines[i]; lines.forEach((x, k) => x.classList.toggle('now', k === i)); SFX.tick();
        await wait(650);
        if (L.kind === 'out') { last = h('div', 'con-line' + (i === c.lines.length - 1 ? ' final' : ''), esc(typeof L.out === 'function' ? String(L.out(v)) : L.out)); con.append(last); }
        else if (L.kind === 'in') { v[L.var] = vals[L.var]; const e = h('span', 'echo', '⌨ ' + v[L.var]); last ? last.append(e) : con.append(e); }
        else if (L.kind === 'calc') { v[L.var] = L.calc(v); $('.cc', lines[i]).append(h('span', 'calc-badge', '→ ' + L.var + ' = ' + v[L.var])); }
        await wait(400);
      }
      lines.forEach(x => x.classList.remove('now'));
      SFX.success(); toast('✅ تم تنفيذ البرنامج بنجاح!', 'ok'); runBtn.style.opacity = ''; running = false;
    };
  },

  /* ---------- صح أم خطأ ---------- */
  tf(b, c) {
    b.innerHTML = `<div class="tf js-list"></div><div class="tf-score rv js-score"></div>`;
    const list = $('.js-list', b), score = $('.js-score', b); let right = 0;
    const upd = () => (score.textContent = `✔ الإجابات الصحيحة: ${right} / ${c.items.length}`);
    c.items.forEach((it, i) => {
      const row = h('div', 'tf-row rv', `<span class="tf-num">${i + 1}</span><div class="tf-txt">${it.text}<small>💡 ${it.fix || ''}</small></div>
        <button class="tf-btn t">✔ صح</button><button class="tf-btn f">✘ خطأ</button>`);
      $$('.tf-btn', row).forEach(btn => (btn.onclick = () => {
        if (row.classList.contains('done')) return;
        const said = btn.classList.contains('t');
        if (said === it.answer) { row.classList.add('done'); btn.classList.add('pick'); right++; upd(); SFX.success(); toast(PRAISE, 'ok'); if (right === c.items.length) confetti(140); }
        else { row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); SFX.wrong(); toast(RETRY, 'bad'); }
      }));
      list.append(row);
    });
    upd();
  },

  /* ---------- التقييم الفوري + تذكرة الخروج ---------- */
  rating(b, c) {
    b.innerHTML = `<div class="rate">
      <div class="rate-btns">${c.options.map((o, i) => `<button class="rbtn rv" data-i="${i}"><div class="re">${o.emoji}</div><div class="rl">${o.label}</div><div class="rc">0</div></button>`).join('')}</div>
      <div class="exit rv js-exit"><div class="eq">${c.exitQ}</div><button class="btn btn-mint js-exbtn">اكشفي الإجابة</button><div class="ea">${c.exitA}</div></div>
    </div>`;
    $$('.rbtn', b).forEach(btn => (btn.onclick = () => {
      const rc = $('.rc', btn); rc.textContent = +rc.textContent + 1;
      btn.classList.remove('bump'); void btn.offsetWidth; btn.classList.add('bump'); SFX.pop();
    }));
    $('.js-exbtn', b).onclick = () => { $('.js-exit', b).classList.add('open'); $('.js-exbtn', b).style.display = 'none'; SFX.success(); };
  },

  /* ---------- الختام ---------- */
  end(b, c) {
    b.innerHTML = `<div class="hero">
      <div class="term rv"><div class="term-bar"><i></i><i></i><i></i><span>goodbye.py</span></div>
        <div class="term-body"><div><span class="prompt">&gt;&gt;&gt; </span><span class="js-typed"></span><span class="caret"></span></div><div class="term-out js-out">${c.output}</div></div></div>
      <h1 class="rv">${c.heading}</h1>
      <p class="hero-sub rv">${c.sub}</p>
      <div class="hw rv">${c.homework}</div>
      <button class="btn btn-primary big rv js-cel">🎉 احتفلي معنا</button>
    </div>`;
    const typed = $('.js-typed', b), out = $('.js-out', b); let job;
    $('.js-cel', b).onclick = () => { confetti(160); SFX.success(); };
    return {
      onEnter() { if (job) job.cancel(); out.classList.remove('show'); job = typeCode(typed, c.code, () => out.classList.add('show')); },
      onLeave() { if (job) job.cancel(); }
    };
  }
};

/* ######################################################################
   🚀  الجزء الرابع: التشغيل والتنقل
   ###################################################################### */
const stage = $('#stage'), host = $('#slides');
let cur = 0;

/* خلفية رموز برمجية خفيفة */
(function buildBg() {
  const syms = [['{ }', 3, 6, 64], ['</>', 90, 12, 54], ['print()', 4, 82, 34], ['0 1 1 0', 84, 88, 30], ['if', 93, 52, 46], [';', 48, 3, 50], ['( )', 1, 46, 44], ['# 🐍', 70, 4, 30], ['def', 30, 92, 34], ['= =', 60, 93, 36]];
  syms.forEach(([t, x, y, s], i) => { const e = h('div', 'bg-sym', t); e.style.left = x + '%'; e.style.top = y + '%'; e.style.fontSize = s + 'px'; e.style.animationDelay = (-i * 1.3) + 's'; $('#bg').append(e); });
})();

/* بناء الشرائح */
STU.load();
const slides = SLIDES.map((cfg, i) => {
  const el = h('section', `slide anim-${cfg.anim || 'fade'} t-${cfg.type}`);
  if (cfg.title && cfg.type !== 'title' && cfg.type !== 'end') {
    el.append(h('header', 's-head rv', `<div class="ttl"><span class="cmt"># ${String(i + 1).padStart(2, '0')}</span><h2>${cfg.title}</h2></div>${cfg.chip ? `<div class="chip">${cfg.chip}</div>` : ''}`));
  }
  const body = h('div', 's-body'); el.append(body);
  let api = {};
  try { api = (RENDER[cfg.type] ? RENDER[cfg.type](body, cfg, el) : null) || {}; }
  catch (err) { console.error(err); body.innerHTML = '<div class="intro">⚠️ خطأ في إعداد هذه الشريحة: ' + esc(String(err.message || err)) + '</div>'; }
  $$('.rv', el).forEach((e, k) => e.style.setProperty('--i', k));
  host.append(el);
  return { el, api };
});

/* الانتقال بين الشرائح */
function go(n) {
  n = Math.max(0, Math.min(slides.length - 1, n));
  if (n === cur) return;
  const dir = n > cur ? 1 : -1, old = slides[cur], nw = slides[n];
  if (old.api.onLeave) old.api.onLeave();
  stage.style.setProperty('--dir', dir);
  void nw.el.offsetWidth;  // لضمان اتجاه الحركة الصحيح
  old.el.classList.remove('active'); old.el.classList.add('out');
  setTimeout(() => old.el.classList.remove('out'), 650);
  cur = n; nw.el.classList.add('active');
  if (nw.api.onEnter) nw.api.onEnter();
  updateUI();
}
const next = () => go(cur + 1), prev = () => go(cur - 1);
function updateUI() {
  $('#counter').textContent = (cur + 1) + ' / ' + slides.length;
  $('#progress span').style.width = ((cur + 1) / slides.length * 100) + '%';
  $('#btnPrev').disabled = cur === 0; $('#btnNext').disabled = cur === slides.length - 1;
  try { history.replaceState(null, '', '#' + (cur + 1)); } catch (e) {}
}

/* تكبير المسرح ليملأ الشاشة بنسبة 16:9 */
function fit() { const s = Math.min(innerWidth / 1600, innerHeight / 900); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
addEventListener('resize', fit);

/* إظهار/إخفاء شريط التحكم تلقائيًا */
let hideT;
function wake() { document.body.classList.add('ui-on'); clearTimeout(hideT); hideT = setTimeout(() => { if (!$('#controls').matches(':hover')) document.body.classList.remove('ui-on'); }, 2800); }
['mousemove', 'mousedown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));

/* أزرار التحكم */
$('#btnNext').onclick = next;
$('#btnPrev').onclick = prev;
$('#btnClap').onclick = clap;
$('#btnRaffle').onclick = () => openRaffle(true);
$('#btnMute').onclick = () => { SFX.muted = !SFX.muted; $('#btnMute').textContent = SFX.muted ? '🔇' : '🔊'; };
const toggleFull = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} };
$('#btnFull').onclick = toggleFull;

/* نوافذ القرعة والتعديل */
$('#mDraw').onclick = () => drawName($('#mName'));
$('#mReset').onclick = () => { STU.resetPicks(); $('#mName').textContent = '؟'; $('#mName').classList.remove('win'); SFX.pop(); };
$('#mClose').onclick = closeModals;
$('#editClose').onclick = closeModals;
$('#editSave').onclick = () => { const arr = $('#editTa').value.split('\n').map(s => s.trim()).filter(Boolean); if (!arr.length) { toast('أضيفي اسمًا واحدًا على الأقل', 'bad'); return; } STU.setNames(arr); closeModals(); toast('تم حفظ ' + arr.length + ' اسمًا ✅', 'ok'); };
$('#editDefault').onclick = () => { STU.setNames(LESSON.students.slice(), false); $('#editTa').value = LESSON.students.join('\n'); toast('تمت استعادة الأسماء الافتراضية', 'ok'); };
$$('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) closeModals(); }));

/* إزالة التركيز عن الأزرار بعد الضغط (حتى لا يضغطها زر المسافة) */
document.addEventListener('click', e => { const bt = e.target.closest('button'); if (bt) setTimeout(() => bt.blur(), 0); });

/* لوحة المفاتيح */
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (e.key === 'Escape') { if (typing) e.target.blur(); closeModals(); return; }
  if (typing) return;
  const modalOpen = !!$('.modal.open');
  if (e.key === 'ت' || e.code === 'KeyJ') { e.preventDefault(); clap(); return; }
  if (e.key === 'ق' || e.code === 'KeyR') { e.preventDefault(); modalOpen ? drawName($('#mName')) : openRaffle(true); return; }
  if (modalOpen) { if (e.code === 'Space') e.preventDefault(); return; }
  switch (e.key) {
    case 'ArrowRight': case 'PageDown': e.preventDefault(); next(); break;
    case 'ArrowLeft': case 'PageUp': e.preventDefault(); prev(); break;
    case 'ArrowUp': case 'ArrowDown': e.preventDefault(); break;
    case 'Home': e.preventDefault(); go(0); break;
    case 'End': e.preventDefault(); go(slides.length - 1); break;
    default:
      if (e.code === 'Space') { e.preventDefault(); next(); }
      else if (e.key === 'ب' || e.code === 'KeyF') { e.preventDefault(); toggleFull(); }
  }
});
/* منع التمرير بعجلة الماوس */
addEventListener('wheel', e => e.preventDefault(), { passive: false });

/* السحب باللمس (للسبورة الذكية): اسحبي لليسار = التالي */
let sx = null, sy = 0;
host.addEventListener('touchstart', e => { if (e.target.closest('button,input,textarea,.bs-board')) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
host.addEventListener('touchend', e => {
  if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 90 && Math.abs(dx) > Math.abs(dy) * 1.5) dx < 0 ? next() : prev();
});

/* البدء */
document.title = LESSON.title + ' — عرض تفاعلي';
fit();
const startAt = Math.min(Math.max(parseInt((location.hash || '').slice(1), 10) - 1 || 0, 0), slides.length - 1);
cur = startAt;
slides[cur].el.classList.add('active');
if (slides[cur].api.onEnter) slides[cur].api.onEnter();
updateUI(); wake();
</script>
</body>
</html>
